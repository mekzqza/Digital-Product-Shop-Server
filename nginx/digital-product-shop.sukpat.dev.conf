# Copy into ~/lab-docker/nginx/conf.d/ on the VPS (port 80 → https redirect lives in 00-default.conf).
server {
    listen 443 ssl;
    http2 on;
    server_name digital-product-shop.sukpat.dev;

    ssl_certificate     /etc/letsencrypt/live/digital-product-shop.sukpat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital-product-shop.sukpat.dev/privkey.pem;

    # resolver + variable = re-resolve after `docker compose up` recreates containers (no nginx reload needed)
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        client_max_body_size 500m; # largest product file
        set $dps_api http://dps-api:4000;
        proxy_pass $dps_api;
    }

    location / {
        set $dps_web http://dps-web:3000;
        proxy_pass $dps_web;
    }
}
